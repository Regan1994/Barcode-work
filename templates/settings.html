{% extends 'base.html' %}
{% block content %}<h1>系統設定</h1><section class="panel form-narrow"><form method="post"><label>全域編號語意<select name="number_semantics"><option value="unknown" {% if number_semantics=='unknown' %}selected{% endif %}>unknown（待確認）</option><option value="asset" {% if number_semantics=='asset' %}selected{% endif %}>asset</option><option value="serial" {% if number_semantics=='serial' %}selected{% endif %}>serial</option></select></label><p class="warning">D01 尚未確認前，請保持 unknown。此設定不會把歷史 snapshot 改成其他語意。</p><label>報工掃描模式<select name="batch_scan_mode"><option value="batch" {% if batch_scan_mode=='batch' %}selected{% endif %}>整批同步（目前使用）</option><option value="job_run" {% if batch_scan_mode=='job_run' %}selected{% endif %}>逐台 job_run（備用）</option></select></label><p class="muted">整批模式下，一張報工單只列印一張 START 與一張 FINISH；掃描後會同步更新該批次所有機台。</p><label>操作者<input name="operator_name" value="admin"></label><button class="button primary">保存設定</button></form></section><section class="panel form-narrow"><h2>安全還原</h2><p class="muted">請輸入已取得的 SQLite 備份完整路徑。系統會先建立目前資料庫的安全備份，再驗證來源 integrity_check 後替換。</p><form method="post" action="{{ url_for('main.restore') }}"><label>備份檔完整路徑<input name="source_path" required placeholder="C:\\...\\intjr_backup_YYYYMMDD_HHMMSS.db"></label><label>操作者<input name="operator_name" value="admin"></label><button class="button">驗證並還原</button></form></section>{% endblock %}
