{% extends 'base.html' %}
{% block content %}<h1>系統設定</h1><section class="panel form-narrow"><form method="post"><label>舊機台編號語意<select name="number_semantics"><option value="unknown" {% if number_semantics=='unknown' %}selected{% endif %}>unknown（待確認）</option><option value="asset" {% if number_semantics=='asset' %}selected{% endif %}>asset</option><option value="serial" {% if number_semantics=='serial' %}selected{% endif %}>serial</option></select></label><p class="warning">此設定只供舊機台主檔與歷史資料使用，不會改動歷史 snapshot；新產品製號由機型主檔字首與製作年份產生。</p><p class="muted">新建立的產品批次固定使用一張 START 與一張 FINISH，同一批所有產品同步更新。舊版逐筆條碼仍可依原設定讀取。</p><label>操作者<input name="operator_name" value="admin"></label><button class="button primary">保存設定</button></form></section><section class="panel form-narrow"><h2>安全還原</h2><p class="muted">請輸入已取得的 SQLite 備份完整路徑。系統會先建立目前資料庫的安全備份，再驗證來源 integrity_check 後替換。</p><form method="post" action="{{ url_for('main.restore') }}"><label>備份檔完整路徑<input name="source_path" required placeholder="C:\\...\\intjr_backup_YYYYMMDD_HHMMSS.db"></label><label>操作者<input name="operator_name" value="admin"></label><button class="button">驗證並還原</button></form></section>{% endblock %}
