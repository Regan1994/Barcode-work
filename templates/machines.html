{% extends 'base.html' %}
{% block content %}<h1>機台主檔</h1><div class="grid two"><section class="panel"><h2>新增機台</h2><form method="post"><label>所屬機型<select name="model_id" required>{% for model in models %}<option value="{{ model.id }}">{{ model.model_name }}（{{ model.model_code }}）</option>{% endfor %}</select></label><label>建立方式<select name="create_mode" id="create_mode"><option value="range">規則產生</option><option value="single">實際清單單筆</option></select></label><div id="range-fields"><label>前綴<input name="prefix" value="E"></label><div class="row"><label>起號<input type="number" name="start" value="1" min="0"></label><label>迄號<input type="number" name="end" value="10" min="0"></label><label>固定寬度<input type="number" name="width" value="2" min="1"></label></div></div><label id="single-field">實際機台編號<input name="display_no" placeholder="例如 E-01"></label><label>編號語意<select name="number_semantics"><option value="unknown">unknown（待確認）</option><option value="asset">asset（已確認為資產號時）</option><option value="serial">serial（已確認為流水號時）</option></select></label><label>操作者<input name="operator_name" value="admin"></label><button class="button primary">建立</button></form></section><section class="panel"><h2>機台清單</h2><p class="muted">示例 E-01 等編號目前不代表永久資產號或批次流水號。</p><table><tr><th>機台</th><th>更新</th></tr>{% for machine in machines %}<tr><td>{{ machine.display_no }}</td><td><form method="post" action="{{ url_for('main.machine_update', machine_id=machine.id) }}" class="inline"><input type="hidden" name="model_id" value="{{ machine.model_id }}"><input name="display_no" value="{{ machine.display_no }}"><select name="number_semantics"><option value="unknown" {% if machine.number_semantics=='unknown' %}selected{% endif %}>unknown</option><option value="asset" {% if machine.number_semantics=='asset' %}selected{% endif %}>asset</option><option value="serial" {% if machine.number_semantics=='serial' %}selected{% endif %}>serial</option></select><select name="is_active"><option value="1" {% if machine.is_active %}selected{% endif %}>啟用</option><option value="0" {% if not machine.is_active %}selected{% endif %}>停用</option></select><input name="operator_name" value="admin"><button class="button small">保存</button></form></td></tr>{% else %}<tr><td colspan="2">請先選擇機型或建立機台</td></tr>{% endfor %}</table></section></div>{% endblock %}
