<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INTJR 條碼報工系統</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">INTJR 條碼報工</a>
    <nav>
      <a href="{{ url_for('main.job_new') }}">建立報工</a>
      <a href="{{ url_for('main.scan_page') }}">掃描報工</a>
      <a href="{{ url_for('main.reports') }}">報表</a>
      <a href="{{ url_for('main.models') }}">機型主檔</a>
      <a href="{{ url_for('main.machines') }}">機台主檔</a>
      <a href="{{ url_for('main.settings') }}">設定</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
