{% extends 'base.html' %}
{% block content %}<h1>建立報工批次</h1><form method="post" action="{{ url_for('main.job_create') }}" class="panel form-wide"><div class="grid two"><label>機型<select name="model_id" id="model_id" required onchange="location='{{ url_for('main.job_new') }}?model_id='+this.value"><option value="">請選擇</option>{% for model in models %}<option value="{{ model.id }}" {% if selected_model|string == model.id|string %}selected{% endif %}>{{ model.model_name }}（{{ model.model_code }}）</option>{% endfor %}</select></label><label>選擇模式<select name="selection_mode"><option value="range">連續範圍</option><option value="multi">非連續多選</option></select></label></div>{% if machines %}<div class="machine-picker"><h2>選擇機台</h2><p class="muted">連續範圍會依主檔排序納入起點至終點；非連續模式可任意勾選。停用資料不會出現。</p><div class="grid two"><div><h3>連續範圍</h3><label>起始機台<select name="range_start">{% for machine in machines %}<option value="{{ machine.id }}">{{ machine.display_no }}</option>{% endfor %}</select></label><label>結束機台<select name="range_end">{% for machine in machines %}<option value="{{ machine.id }}">{{ machine.display_no }}</option>{% endfor %}</select></label></div><div><h3>非連續多選</h3><div class="machine-grid">{% for machine in machines %}<label class="check"><input type="checkbox" name="machine_ids" value="{{ machine.id }}">{{ machine.display_no }}</label>{% endfor %}</div></div></div></div>{% endif %}<div class="grid three"><label>工單號<input name="work_order_no"></label><label>產品批號<input name="product_lot_no"></label><label>製程<input name="process_name"></label></div><div class="grid two"><label>計畫數量<input type="number" name="planned_qty" min="1" required></label><label>操作者<input name="operator_name" required></label></div><button class="button primary" {% if not machines %}disabled{% endif %}>建立批次並產生條碼</button></form>{% endblock %}
