{% extends 'base.html' %}
{% block content %}
<h1>組裝人員</h1>
<div class="grid two">
  <section class="panel">
    <h2>新增組裝人員</h2>
    <form method="post">
      <label>姓名<input name="name" required maxlength="100" autocomplete="name" placeholder="輸入組裝人員姓名"></label>
      <button class="button primary">新增人員</button>
    </form>
  </section>
  <section class="panel table-wrap">
    <h2>人員清單</h2>
    <p class="muted">停用的人員不會出現在建立報工的選單中；既有報工紀錄會保留原姓名。</p>
    <table>
      <tr><th>姓名</th><th>狀態</th><th>操作</th></tr>
      {% for worker in workers %}
      <tr>
        <td>{{ worker.name }}</td>
        <td>{{ '啟用' if worker.is_active else '停用' }}</td>
        <td>
          <form method="post" action="{{ url_for('main.assembly_worker_status', worker_id=worker.id) }}">
            <input type="hidden" name="is_active" value="{{ 0 if worker.is_active else 1 }}">
            <button class="button small">{{ '停用' if worker.is_active else '重新啟用' }}</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3">尚未建立組裝人員</td></tr>
      {% endfor %}
    </table>
  </section>
</div>
{% endblock %}
