{% extends 'base.html' %}
{% block content %}<h1>機型主檔</h1><div class="grid two"><section class="panel"><h2>新增機型</h2><form method="post"><label>機型名稱<input name="model_name" required placeholder="例如 HR-255"></label><label>機型代碼<input name="model_code" required placeholder="不可含空白或 |"></label><label>製號字首<input name="serial_prefix" placeholder="例如 E、ER、C、CR"></label><label>說明<textarea name="description"></textarea></label><label>操作者<input name="operator_name" value="admin"></label><button class="button primary">建立</button></form></section><section class="panel"><h2>現有機型</h2><p class="muted">製號字首用於產生產品製號；例如 E + 年號 27 + 流水號 10 = E27-10。</p><table><tr><th>名稱（代碼）</th><th>狀態</th><th>更新</th></tr>{% for model in models %}<tr><td>{{ model.model_name }}（{{ model.model_code }}）<small>{{ model.description }}</small></td><td>{{ '啟用' if model.is_active else '停用' }}</td><td><form method="post" action="{{ url_for('main.model_update', model_id=model.id) }}" class="inline"><input name="model_name" value="{{ model.model_name }}" required><input name="model_code" value="{{ model.model_code }}" required><input name="serial_prefix" value="{{ model.serial_prefix }}" placeholder="製號字首"><input name="description" value="{{ model.description or '' }}"><select name="is_active"><option value="1" {% if model.is_active %}selected{% endif %}>啟用</option><option value="0" {% if not model.is_active %}selected{% endif %}>停用</option></select><input name="operator_name" value="admin"><button class="button small">保存</button></form></td></tr>{% else %}<tr><td colspan="3">尚無資料</td></tr>{% endfor %}</table></section></div>{% endblock %}
